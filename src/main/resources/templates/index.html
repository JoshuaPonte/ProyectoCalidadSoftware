
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mass Manager - Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="#">📊 MASS MANAGER</a>
            <span class="navbar-text text-white-50">Panel de Control de Inventario</span>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="m-0 font-weight-bold text-primary">Lista General de Productos</h5>
                <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#productModal">+ Registrar Producto</button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped m-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Nombre del Producto</th>
                                <th>Precio Unitario</th>
                                <th>Stock Disponible</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${listProducts}">
                                <td class="ps-4" th:text="${product.id}">1</td>
                                <td th:text="${product.name}">Producto Ejemplo</td>
                                <td th:text="${'S/ ' + #numbers.formatDecimal(product.price, 1, 2)}">S/ 0.00</td>
                                <td>
                                    <span th:text="${product.stock}" 
                                          th:classappend="${product.stock < 10} ? 'badge bg-danger' : 'badge bg-secondary'">
                                        0
                                    </span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/showFormForUpdate/{id}(id=${product.id})}" class="btn btn-warning btn-sm me-1">Editar</a>
                                    <a th:href="@{/deleteProduct/{id}(id=${product.id})}" 
                                       class="btn btn-danger btn-sm" 
                                       onclick="return confirm('¿Está seguro de que desea eliminar este producto del inventario?');">
                                        Eliminar
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(listProducts)}">
                                <td colspan="5" class="text-center text-muted py-4">No hay productos registrados en el sistema.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="productModal" th:classappend="${showModal} ? 'show d-block'" tabindex="-1" aria-labelledby="productModalLabel" th:aria-hidden="${showModal} ? 'false' : 'true'" th:style="${showModal} ? 'background: rgba(0,0,0,0.5)' : ''">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="productModalLabel">Formulario de Producto</h5>
                    <a th:if="${showModal}" href="/" class="btn-close btn-close-white"></a>
                    <button th:unless="${showModal}" type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/saveProduct}" th:object="${product}" method="POST">
                    <div class="modal-body">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="mb-3">
                            <label class="form-label">Nombre del Producto</label>
                            <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" placeholder="Ej. Arroz Integral 1kg"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Precio (S/)</label>
                            <input type="number" step="0.01" th:field="*{price}" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'" placeholder="0.00"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Stock Inicial</label>
                            <input type="number" th:field="*{stock}" class="form-control" th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'" placeholder="0"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <a th:if="${showModal}" href="/" class="btn btn-secondary">Cancelar</a>
                        <button th:unless="${showModal}" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Guardar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
